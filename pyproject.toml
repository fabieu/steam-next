[project]
name = "steam-plus"
description = "Python package for interacting with Steam"
authors = [
    { name = "Rossen Georgiev", email = "rossen@rgp.io" }
]
maintainers = [
    { name = "Fabian Eulitz", email = "dev@sustineo.de" }
]
version = "0.1.0"
license = { text = "MIT" }
readme = "README.rst"
requires-python = ">=3.10,<4.0"
dependencies = [
    "six (>=1.10.0)",
    "pycryptodomex (>=3.23.0,<4.0)",
    "requests (>=2.32.5,<3.0)",
    "vdf (>=3.4.0,<4.0)",
    "gevent (>=1.3.0)",
    "protobuf (>=3.0,<4.0)",
    "gevent-eventemitter (>=2.1,<3.0)",
    "cachetools (>=6.2.4,<7.0)",
]
keywords = [
    "valve",
    "steam",
    "steamid",
    "api",
    "webapi",
    "steamcommunity"
]

[dependency-groups]
dev = [
    "vcrpy (==2.0.1)",
    "pyyaml (>=5.4)",
    "mock (==1.3.0)",
    "coverage (>=5.0)",
    "pytest-cov (>=2.7.0)",
    "coveralls (>=2.1.2)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# This replaces setuptools.find_packages()
packages = [{ include = "steam" }]


