name: Set up Poetry
description: Install Python and Poetry, with caching for the project virtualenv.

inputs:
  python-version:
    description: Python version to install.
    required: true
  poetry-version:
    description: Poetry version to install.
    required: false
    default: "2.4.1"
  install-args:
    description: Arguments to pass to `poetry install`. Leave empty to skip installation.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
      run: pipx install "poetry==$POETRY_VERSION"

    - name: Configure Poetry to use in-project virtualenv
      shell: bash
      run: poetry config virtualenvs.in-project true

    - name: Cache Poetry virtualenv
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      if: inputs.install-args != ''
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: poetry install --no-interaction --no-ansi $INSTALL_ARGS
